name: GH Actions CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  main-tests:
    if: "github.repository == 'rsexton2/glycokit'"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        mdanalysis-version: ["latest", "develop"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Build information
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Install conda dependencies
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          environment-file: devtools/conda-envs/test_env.yaml
          add-pip-as-python-dependency: true
          miniforge-version: "latest"
          use-mamba: true
          channels: conda-forge
          activate-environment: glycokit-test
          auto-update-conda: true
          auto-activate-base: false
          show-channel-urls: true

      - name: Install package
        run: |
          conda activate glycokit-test
          python --version
          python -m pip install . --no-deps

      - name: Python information
        run: |
          conda activate glycokit-test
          which python
          which pip
          pip list
          conda info
          conda list

      - name: Run tests
        run: |
          conda activate glycokit-test
          pytest --cov=. --junitxml=junit.xml -o junit_family=legacy --cov-report=xml:coverage.xml --cov-report=term

      - name: codecov
        if: github.repository == 'rsexton2/glycokit' && github.event_name != 'schedule'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: junit.xml
          name: codecov-tests-${{ matrix.os }}-py${{ matrix.python-version }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  pylint_check:
    if: "github.repository == 'rsexton2/glycokit'"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pylint
        run: |
          which pip
          which python
          pip install pylint mdanalysis

      - name: Run Pylint
        env:
          PYLINTRC: .pylintrc
        run: |
          pylint .

  pypi_check:
    if: "github.repository == 'rsexton2/glycokit'"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pipx twine

      - name: Build package
        run: |
          python -m pipx run build --sdist

      - name: Check package build
        run: |
          DISTRIBUTION=$(ls -t1 dist/glycokit-*.tar.gz | head -n 1)
          test -n "${DISTRIBUTION}" || { echo "no distribution dist/glycokit-*.tar.gz found"; exit 1; }
          echo "twine check $DISTRIBUTION"
          twine check $DISTRIBUTION